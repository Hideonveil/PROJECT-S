services:
  appsmith:
    image: appsmith/appsmith-ce:release
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - appsmith_stacks:/appsmith-stacks
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/api/v1/health | grep -q ."]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  appsmith_stacks:
