services:
  appsmith:
    image: appsmith/appsmith-ce:release
    restart: unless-stopped
    env_file: .env.local
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - appsmith_stacks:/appsmith-stacks
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/api/v1/health | grep -q 'All systems are up'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  metabase-db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.local
    environment:
      POSTGRES_DB: ${METABASE_APP_DB_NAME:-metabase}
      POSTGRES_USER: ${METABASE_APP_DB_USER:-metabase}
      POSTGRES_PASSWORD: ${METABASE_APP_DB_PASSWORD}
    volumes:
      - metabase_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METABASE_APP_DB_USER:-metabase} -d ${METABASE_APP_DB_NAME:-metabase}"]
      interval: 10s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    restart: unless-stopped
    env_file: .env.local
    depends_on:
      metabase-db:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${METABASE_APP_DB_NAME:-metabase}
      MB_DB_USER: ${METABASE_APP_DB_USER:-metabase}
      MB_DB_PASS: ${METABASE_APP_DB_PASSWORD}
      JAVA_OPTS: ${METABASE_JAVA_OPTS:--Xmx2g}
    ports:
      - "127.0.0.1:3002:3000"

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      # Preserve the Production hostname for HTTPS/SNI while keeping traffic
      # inside the founder Mac's loopback SSH tunnel.
      - "www.jiyuan.online:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./.secrets/ops_metrics_token:/etc/prometheus/secrets/ops_metrics_token:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    env_file: .env.local
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  appsmith_stacks:
  metabase_db_data:
  prometheus_data:
  grafana_data:
