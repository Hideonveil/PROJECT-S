global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: jiyuan_production_metrics
    scheme: http
    metrics_path: /api/internal/ops-v2/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/ops_metrics_token
    static_configs:
      # Docker Desktop resolves this to the founder Mac, where SSH forwards the
      # protected Production endpoint to 127.0.0.1:9464.
      - targets: [host.docker.internal:9464]

